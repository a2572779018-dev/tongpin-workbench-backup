name: Desktop builds

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only the Windows candidate installer
        type: boolean
        default: false
      client_hotfix:
        description: Client-only patch (full backend suite stays in Linux quality; native client checks run on Windows)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Cloudflare checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:cloudflare
      - run: npm run cloudflare:check

  windows:
    name: Windows installer
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      # Normal CI retains the existing full Windows suite. A manually selected
      # client-only hotfix still requires the full Linux quality job above.
      # The production desktop connects to Cloudflare and does not ship or run
      # dist/server; Windows Node-backend compatibility is a separate result.
      - if: ${{ !inputs.client_hotfix }}
        run: npm run dist:win
      - name: Check Windows client hotfix
        if: ${{ inputs.client_hotfix }}
        run: |
          node scripts/verify-computer-use-runtime.cjs --source --target win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec vitest -- run src electron cloudflare/src --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:opensquilla-router
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows client hotfix
        if: ${{ inputs.client_hotfix }}
        run: npm exec electron-builder -- --win nsis --publish never
      - name: Verify packaged Electron runtime files
        shell: pwsh
        run: node scripts/verify-asar-contents.cjs (Resolve-Path "artifacts/win-unpacked/resources/app.asar") --target win32-x64
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath artifacts -Filter "Tongpin-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if (-not (Test-Path -LiteralPath artifacts/latest.yml)) {
            throw "artifacts/latest.yml was not generated."
          }
          if ($installers[0].Length -le 0) {
            throw "Windows installer is empty."
          }
      - run: npm run release:verify:win
      - name: Keep Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tongpin-windows-${{ github.sha }}
          path: |
            artifacts/Tongpin-Setup-*.exe
            artifacts/Tongpin-Setup-*.exe.blockmap
            artifacts/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal test package
    if: ${{ !inputs.windows_only }}
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Prepare and verify macOS universal Computer Use runtime
        run: |
          node scripts/prepare-computer-use-runtime.cjs --target darwin-universal
          node scripts/verify-computer-use-runtime.cjs --source --target darwin-universal
      - run: npm run build
      - name: Package unsigned universal app
        run: >-
          npm exec electron-builder -- --mac dmg zip --universal --publish never
          -c.mac.identity=null
          -c.mac.hardenedRuntime=false
          -c.mac.notarize=false
      - name: Verify packaged Electron runtime files
        shell: bash
        run: |
          set -euo pipefail
          app_asar="$(find artifacts -path '*/Contents/Resources/app.asar' -print -quit)"
          [[ -n "$app_asar" ]]
          node scripts/verify-asar-contents.cjs "$app_asar" --target darwin-universal
      - run: npm run release:verify:mac
      - name: Verify macOS artifacts and architectures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          zips=(artifacts/*.zip)
          [[ ${#dmgs[@]} -eq 1 ]]
          [[ ${#zips[@]} -eq 1 ]]
          [[ -f artifacts/latest-mac.yml ]]
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$app_path" ]]
          executable="$(plutil -extract CFBundleExecutable raw -o - "$app_path/Contents/Info.plist")"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
