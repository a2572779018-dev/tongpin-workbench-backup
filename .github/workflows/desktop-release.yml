name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(jq -r .version package.json)"
          [[ "$GITHUB_REF_NAME" == "v${package_version}" ]]
          git show-ref --verify refs/remotes/origin/main
          [[ "$GITHUB_SHA" == "$(git rev-parse refs/remotes/origin/main)" ]]
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:cloudflare
      - run: npm run cloudflare:check

  prepare:
    name: Prepare draft release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_count="$(jq --arg tag "$GITHUB_REF_NAME" \
            '[.[] | select(.tag_name == $tag)] | length' <<<"$releases_json")"
          [[ "$release_count" -le 1 ]]
          if [[ "$release_count" -eq 1 ]]; then
            release_json="$(jq -c --arg tag "$GITHUB_REF_NAME" \
              '.[] | select(.tag_name == $tag)' <<<"$releases_json")"
            [[ "$(jq -r .draft <<<"$release_json")" == "true" ]]
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]]
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(jq -r '.assets[].id' <<<"$release_json")
            gh release edit "$GITHUB_REF_NAME" \
              --title "同频 $version" \
              --notes-file build/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "同频 $version" \
              --notes-file build/release-notes.md
          fi

  windows:
    name: Windows release package
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - run: npm run dist:win
      - name: Verify packaged Electron runtime files
        shell: pwsh
        run: node scripts/verify-asar-contents.cjs (Resolve-Path "artifacts/win-unpacked/resources/app.asar") --target win32-x64
      - run: npm run release:verify:win
      - name: Upload Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -LiteralPath artifacts -Filter "Tongpin-Setup-*.exe")
          $blockmaps = @(Get-ChildItem -LiteralPath artifacts -Filter "Tongpin-Setup-*.exe.blockmap")
          $manifest = Get-Item -LiteralPath artifacts/latest.yml
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one Windows blockmap, found $($blockmaps.Count)."
          }
          if ($installers[0].Name -ne "Tongpin-Setup-$version.exe") {
            throw "Unexpected Windows installer name: $($installers[0].Name)."
          }
          if ($blockmaps[0].Name -ne "Tongpin-Setup-$version.exe.blockmap") {
            throw "Unexpected Windows blockmap name: $($blockmaps[0].Name)."
          }
          $files = @(
            $installers[0].FullName
            $blockmaps[0].FullName
            $manifest.FullName
          )
          gh release upload $env:GITHUB_REF_NAME @files --clobber

  macos:
    name: macOS universal release package
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Prepare and verify macOS universal Computer Use runtime
        run: |
          node scripts/prepare-computer-use-runtime.cjs --target darwin-universal
          node scripts/verify-computer-use-runtime.cjs --source --target darwin-universal
      - run: npm run build
      - name: Package unsigned universal app
        run: >-
          npm exec electron-builder -- --mac dmg zip --universal --publish never
          -c.mac.identity=null
          -c.mac.hardenedRuntime=false
          -c.mac.notarize=false
      - name: Verify packaged Electron runtime files
        shell: bash
        run: |
          set -euo pipefail
          app_asar="$(find artifacts -path '*/Contents/Resources/app.asar' -print -quit)"
          [[ -n "$app_asar" ]]
          node scripts/verify-asar-contents.cjs "$app_asar" --target darwin-universal
      - run: npm run release:verify:mac
      - name: Verify macOS artifacts and architectures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          zips=(artifacts/*.zip)
          [[ ${#dmgs[@]} -eq 1 ]]
          [[ ${#zips[@]} -eq 1 ]]
          [[ -f artifacts/latest-mac.yml ]]
          hdiutil verify "${dmgs[0]}"
          unzip -t "${zips[0]}"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$app_path" ]]
          executable="$(plutil -extract CFBundleExecutable raw -o - "$app_path/Contents/Info.plist")"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
      - name: Upload macOS release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          files=(
            "artifacts/Tongpin-${version}-mac-universal.dmg"
            "artifacts/Tongpin-${version}-mac-universal.dmg.blockmap"
            "artifacts/Tongpin-${version}-mac-universal.zip"
            "artifacts/Tongpin-${version}-mac-universal.zip.blockmap"
            artifacts/latest-mac.yml
          )
          for file in "${files[@]}"; do
            [[ -s "$file" ]]
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish:
    name: Publish release
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_count="$(jq --arg tag "$GITHUB_REF_NAME" \
            '[.[] | select(.tag_name == $tag)] | length' <<<"$releases_json")"
          [[ "$release_count" -eq 1 ]]
          release_json="$(jq -c --arg tag "$GITHUB_REF_NAME" \
            '.[] | select(.tag_name == $tag)' <<<"$releases_json")"
          [[ "$(jq -r .draft <<<"$release_json")" == "true" ]]
          [[ "$(jq -r .tag_name <<<"$release_json")" == "$GITHUB_REF_NAME" ]]
          jq -e '(.assets | length) == 8 and all(.assets[]; .size > 0)' \
            <<<"$release_json" >/dev/null

          expected=(
            "Tongpin-Setup-${version}.exe"
            "Tongpin-Setup-${version}.exe.blockmap"
            "latest.yml"
            "Tongpin-${version}-mac-universal.dmg"
            "Tongpin-${version}-mac-universal.dmg.blockmap"
            "Tongpin-${version}-mac-universal.zip"
            "Tongpin-${version}-mac-universal.zip.blockmap"
            "latest-mac.yml"
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(jq -r '.assets[].name' <<<"$release_json" | sort)

          release_id="$(jq -r .id <<<"$release_json")"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false >/dev/null
